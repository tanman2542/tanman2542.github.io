name: Materialize icons
on:
  push:
    paths:
      - "icon-sources/**"
      - ".github/workflows/materialize-icons.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG icons
        run: |
          python3 <<'PY'
          import base64, pathlib
          mapping = {
            "icon-sources/favicon.png.b64": [
              "favicon.png",
              "friends/favicon.png",
            ],
            "icon-sources/apple-touch-icon.png.b64": [
              "icons/apple-touch-icon.png",
              "friends/icons/apple-touch-icon.png",
            ],
            "icon-sources/icon-192.png.b64": [
              "icons/icon-192.png",
              "friends/icons/icon-192.png",
            ],
            "icon-sources/icon-512.png.b64": [
              "icons/icon-512.png",
              "friends/icons/icon-512.png",
            ],
            "icon-sources/maskable-512.png.b64": [
              "icons/maskable-512.png",
              "friends/icons/maskable-512.png",
            ],
          }
          for src, dests in mapping.items():
              data = pathlib.Path(src).read_text().strip()
              raw = base64.b64decode(data)
              for dest in dests:
                  path = pathlib.Path(dest)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(raw)
                  print(dest, path.stat().st_size)
          PY
      - name: Commit icons if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png icons/*.png friends/favicon.png friends/icons/*.png
          git diff --cached --quiet || git commit -m "Add Ember PNG icons"
          git push
